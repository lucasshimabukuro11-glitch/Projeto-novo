name: EventScan CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - eventscan/product-catalog

permissions:
  contents: read

jobs:
  build-and-unit-tests:
    name: Build e testes unitarios
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Testes unitarios
        run: npm test

      - name: Verificar TypeScript e compilar
        run: npm run build
